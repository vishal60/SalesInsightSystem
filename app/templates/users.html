{% extends "base.html" %}{% block title %}Users{% endblock %}
{% block content %}<div class="mb-4"><div class="eyebrow">ADMINISTRATION</div><h2 class="page-title">User Management</h2></div>
<div class="row g-4"><div class="col-lg-8"><div class="panel"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Created</th></tr></thead><tbody>{% for u in users %}<tr><td>{{u.name}}</td><td>{{u.email}}</td><td><span class="badge-soft">{{u.role}}</span></td><td>{{u.created_at.strftime('%Y-%m-%d')}}</td></tr>{% endfor %}</tbody></table></div></div>
<div class="col-lg-4"><div class="panel"><h5 class="mb-3">Create User</h5><form method="post" action="{{url_for('main.add_user')}}"><input name="name" class="form-control mb-2" placeholder="Full name" required><input name="email" type="email" class="form-control mb-2" placeholder="Email" required><input name="password" type="password" class="form-control mb-2" placeholder="Password" required><select name="role" class="form-select mb-3"><option value="user">User</option><option value="admin">Admin</option></select><button class="btn btn-dark w-100">Create User</button></form></div></div></div>{% endblock %}
