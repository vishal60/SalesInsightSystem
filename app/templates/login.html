<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login · Sales Insight</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet"></head>
<body class="login-bg"><div class="login-card">
<div class="brand-mark">SI</div><h1>Sales Insight</h1><p class="text-muted">Analytics & Forecasting System</p>
{% with messages = get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="alert alert-{{c}}">{{m}}</div>{% endfor %}{% endwith %}
<form method="post"><label>Email</label><input class="form-control mb-3" type="email" name="email" value="admin@demo.com" required>
<label>Password</label><input class="form-control mb-4" type="password" name="password" value="admin123" required>
<button class="btn btn-dark w-100 py-2">Sign in</button></form>
<div class="demo-box mt-4"><b>Demo credentials</b><br>Admin: admin@demo.com / admin123<br>User: user@demo.com / user123</div>
</div></body></html>
